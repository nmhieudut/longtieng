name: Release

# Push a tag vX.Y.Z (packaging/release.py does it) -> build Mac + Windows, publish a GitHub Release
# with the installers, the light-update patch and latest.json (read by the app's updater).
# Run manually (workflow_dispatch) to just build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: ./packaging/build_windows.ps1
      # The in-app Windows update copies the new app over the old folder (app/update.py finish_update).
      # Run exactly that on the built app, then start the copy: nobody has a Windows machine to try it on.
      - name: Test the updater's copy step
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP "old-install\Longtieng"
          New-Item -ItemType Directory "$old\_internal" -Force | Out-Null
          Set-Content "$old\Longtieng.exe" "old"
          Set-Content "$old\_internal\stale.dll" "old"
          $env:LONGTIENG_HOME = Join-Path $env:RUNNER_TEMP "lt-home"
          $env:LONGTIENG_FINISH_NO_RELAUNCH = "1"
          $p = Start-Process dist/Longtieng/Longtieng.exe -ArgumentList "--finish-update", "`"$old`"", "--wait-pid", "999999" -Wait -PassThru -NoNewWindow
          Get-Content "$env:LONGTIENG_HOME\logs\update.log" -ErrorAction SilentlyContinue | Out-Host
          if ($p.ExitCode -ne 0) { throw "finish-update exited with $($p.ExitCode)" }
          if ((Get-Item "$old\Longtieng.exe").Length -ne (Get-Item dist/Longtieng/Longtieng.exe).Length) { throw "Longtieng.exe was not replaced" }
          if (Test-Path "$old\_internal\stale.dll") { throw "old files were not removed" }
          if (-not (Get-ChildItem "$old\_internal" -Filter "python3*.dll")) { throw "python dll missing after copy" }
          # the copy must run on its own
          $v = Start-Process "$old\Longtieng.exe" -ArgumentList "--yt-dlp", "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\ytdlp.txt"
          Get-Content "$env:RUNNER_TEMP\ytdlp.txt" | Out-Host
          if ($v.ExitCode -ne 0) { throw "the copied app does not start ($($v.ExitCode))" }
      - name: Light-update patch
        shell: pwsh
        run: uv run python packaging/make_patch.py --zip "dist/Longtieng-$((Get-Content packaging/VERSION).Trim())-patch.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          retention-days: 30

  mac:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg with libass
        run: brew install ffmpeg-full
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build
        run: ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: latest.json
        run: |
          # keep only the release files, flat (artifacts can carry extra folders)
          mkdir release
          find assets -type f \( -name '*.zip' -o -name '*.dmg' \) -exec mv {} release/ \;
          ls -la release
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d' > notes.txt
          python3 packaging/latest_json.py "$GITHUB_REF_NAME" release notes.txt > release/latest.json
          cat release/latest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Lồng tiếng $GITHUB_REF_NAME" --notes-file notes.txt --latest
