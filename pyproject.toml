[project]
name = "longtieng"
version = "0.1.0"
description = "App lồng tiếng video cá nhân (Trung → Việt) cho Mac và Windows"
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "edge-tts>=7.3.1",
    "fastapi>=0.162.0",
    "gtts>=2.5.4",
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1 ; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "rapidocr-onnxruntime>=1.4 ; sys_platform != 'darwin'",
    "psutil>=6",
    "yt-dlp>=2026.10.21",
    "httpx",
    "pywebview>=5",
    "certifi",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "opencc-python-reimplemented>=0.1.7",
    "pyobjc-framework-vision>=11 ; sys_platform == 'darwin'",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "vieneu==3.8.3",  # offline Vietnamese voices; pinned because app/vieneu_tts.py patches a private hook
]

[project.optional-dependencies]
demucs = [
    "demucs>=4.0.1",
]

[dependency-groups]
build = ["pyinstaller>=6.10"]
# lets the Windows code paths (faster-whisper, RapidOCR) be tested on a Mac
crossplat = ["faster-whisper>=1.1", "rapidocr-onnxruntime>=1.4"]

[tool.uv]
# vieneu lists gradio and librosa as hard requirements, but they are only used by its own web demo and by
# voice cloning. We use the preset voices only, so keep them (and their huge dependency trees) out.
override-dependencies = [
    "gradio ; sys_platform == 'never'",
    "librosa ; sys_platform == 'never'",
]
